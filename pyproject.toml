[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pulso-transmi"
version = "0.1.0"
description = "SDK estudiantil para el reto MLOps Pulso TransMi"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.28,<1",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.5,<2", "joblib>=1.4,<2", "catboost>=1.2,<2"]
mlops = ["mlflow>=3.0,<4"]
dev = ["pytest>=8,<9"]
eda = [
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
  "folium>=0.17,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
