# Temporary: read-only comparison of post-model adjustments (periodic experts for the 4h-periodic
# injected drift) on real production data, run from this branch with the repository secrets.
# Remove once the results are in.
name: backtest-adjustments

on:
  push:
    branches: [claude/intelligent-bell-np1lix]
    paths: [.github/workflows/backtest-adjustments.yml, scripts/backtest_adjustments.py]

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        horizon: [15, 30, 45, 60]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[ml]'
      - name: Backtest post-model adjustments (read-only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/backtest_adjustments.py ${{ matrix.horizon }}
