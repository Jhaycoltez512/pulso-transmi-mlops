# Temporary and read-only: prints the competition leaderboard and the API's endpoint list.
# Remove once read.
name: peek-leaderboard

on:
  push:
    branches: [claude/intelligent-bell-np1lix]
    paths: [.github/workflows/peek-leaderboard.yml, scripts/peek_leaderboard.py]

permissions:
  contents: read

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install httpx
      - name: Read leaderboard (read-only)
        env:
          PULSO_API_URL: ${{ vars.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
        run: python scripts/peek_leaderboard.py
