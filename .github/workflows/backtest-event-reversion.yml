# Temporary: read-only backtest on real production data (pulling predictions back to the
# comparable day's profile during short events), run from this branch with the repository
# secrets. Remove once the results are in.
name: backtest-event-reversion

on:
  push:
    branches: [claude/intelligent-bell-np1lix]
    paths: [.github/workflows/backtest-event-reversion.yml]

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        horizon: [15, 30, 45, 60]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[ml]'
      - name: Backtest event reversion (read-only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/backtest_event_reversion.py ${{ matrix.horizon }}
