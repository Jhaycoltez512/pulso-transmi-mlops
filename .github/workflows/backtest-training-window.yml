# Temporary: read-only backtest on real production data (training window, recency weighting,
# 1-day memory) run from this branch with the repository secrets. Remove once the results are in.
name: backtest-training-window

on:
  push:
    branches: [claude/intelligent-bell-np1lix]
    paths: [.github/workflows/backtest-training-window.yml]

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        horizon: [15, 30, 45, 60]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[ml]'
      - name: Backtest training window and memory (read-only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/backtest_training_window.py ${{ matrix.horizon }}
