# Temporary: Storage cleanup and a read-only backtest on real production data, run from
# this branch. The prune step only lists what it would delete unless PRUNE_APPLY is "true".
# Remove once the results are in.
name: validate-and-prune

on:
  push:
    branches: [claude/intelligent-bell-np1lix]
    paths: [.github/workflows/validate-and-prune.yml]

permissions:
  contents: read

env:
  PRUNE_APPLY: "true"

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[ml]'
      - name: Prune old model bundles (keep 5 oldest, 5 newest, active)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/prune_model_storage.py $([ "$PRUNE_APPLY" = "true" ] && echo --apply)

  backtest:
    if: ${{ false }}  # already running from the previous push; don't start a second copy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        horizon: [15, 30, 45, 60]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[ml]'
      - name: Backtest over the demand-shift period (read-only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/backtest_production_shift.py ${{ matrix.horizon }}
