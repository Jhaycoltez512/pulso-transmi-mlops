# Temporary and read-only: candidate forecasters on the 8h regime. Remove once read.
name: peek-experiment

on:
  push:
    branches: [claude/intelligent-bell-np1lix]
    paths: [.github/workflows/peek-experiment.yml, scripts/experiment_8h.py]

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[ml,mlops]'
      - name: Experiment (read-only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: cd scripts && python experiment_8h.py
