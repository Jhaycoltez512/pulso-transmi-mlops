# Temporary: read-only backtest of refinements to the 4h-periodic copy. Remove once read.
name: backtest-periodic

on:
  push:
    branches: [claude/intelligent-bell-np1lix]
    paths: [.github/workflows/backtest-periodic.yml, scripts/backtest_periodic.py]

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[ml]'
      - name: Backtest periodic refinements (read-only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: cd scripts && python backtest_periodic.py
