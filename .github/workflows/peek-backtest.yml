# Temporary and read-only: replays the ensemble with smoothed period copies on the live cycles. Remove once read.
name: peek-backtest

on:
  push:
    branches: [claude/intelligent-bell-np1lix]
    paths: [.github/workflows/peek-backtest.yml, scripts/backtest_regime_switch.py, scripts/forecast_adjustments.py]

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[ml,mlops]'
      - name: Replay (read-only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: cd scripts && python backtest_regime_switch.py
